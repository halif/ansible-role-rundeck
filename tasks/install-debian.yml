---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
      - apt-transport-https
    state: present
    update_cache: true

- name: Download Rundeck APT repository setup script
  ansible.builtin.get_url:
    url: https://packagecloud.io/install/repositories/pagerduty/rundeck/script.deb.sh
    dest: /tmp/rundeck-packagecloud-deb.sh
    mode: "0755"
    force: false

- name: Add Rundeck APT repository
  ansible.builtin.command:
    argv:
      - bash
      - /tmp/rundeck-packagecloud-deb.sh
    creates: /etc/apt/sources.list.d/pagerduty_rundeck.list

- name: Install Rundeck package
  ansible.builtin.apt:
    name: "{{ rundeck_package_name }}{{ ('=' + rundeck_version) if rundeck_version != 'latest' else '' }}"
    state: "{{ rundeck_package_state }}"
    update_cache: true
