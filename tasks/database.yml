---
- name: Create libext directory for JDBC drivers
  ansible.builtin.file:
    path: "{{ rundeck_jdbc_lib_dir }}"
    state: directory
    owner: rundeck
    group: rundeck
    mode: "0755"
  when: rundeck_database_type != 'h2'

- name: Download MySQL JDBC driver
  ansible.builtin.get_url:
    url: >-
      {{
        'https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/'
        ~ rundeck_jdbc_mysql_version
        ~ '/mysql-connector-j-'
        ~ rundeck_jdbc_mysql_version
        ~ '.jar'
      }}
    dest: "{{ rundeck_jdbc_lib_dir }}/mysql-connector-j-{{ rundeck_jdbc_mysql_version }}.jar"
    owner: rundeck
    group: rundeck
    mode: "0644"
  when: rundeck_database_type == 'mysql'
  notify: Restart Rundeck

- name: Download PostgreSQL JDBC driver
  ansible.builtin.get_url:
    url: >-
      {{
        'https://repo1.maven.org/maven2/org/postgresql/postgresql/'
        ~ rundeck_jdbc_postgresql_version
        ~ '/postgresql-'
        ~ rundeck_jdbc_postgresql_version
        ~ '.jar'
      }}
    dest: "{{ rundeck_jdbc_lib_dir }}/postgresql-{{ rundeck_jdbc_postgresql_version }}.jar"
    owner: rundeck
    group: rundeck
    mode: "0644"
  when: rundeck_database_type == 'postgresql'
  notify: Restart Rundeck

- name: Ensure target database exists (PostgreSQL)
  community.postgresql.postgresql_db:
    name: "{{ rundeck_database_name }}"
    login_host: "{{ rundeck_database_host }}"
    login_user: "{{ rundeck_database_admin_user | default('postgres') }}"
    login_password: "{{ rundeck_database_admin_password | default(omit) }}"
  when:
    - rundeck_database_type == 'postgresql'
    - rundeck_database_manage_db | default(false)
  delegate_to: "{{ rundeck_database_host }}"

- name: Ensure target database exists (MySQL)
  community.mysql.mysql_db:
    name: "{{ rundeck_database_name }}"
    login_host: "{{ rundeck_database_host }}"
    login_user: "{{ rundeck_database_admin_user | default('root') }}"
    login_password: "{{ rundeck_database_admin_password | default(omit) }}"
  when:
    - rundeck_database_type == 'mysql'
    - rundeck_database_manage_db | default(false)
  delegate_to: "{{ rundeck_database_host }}"
