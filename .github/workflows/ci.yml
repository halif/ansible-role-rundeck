---
name: CI

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ansible tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint -c .config/yamllint.yml .

      - name: Run ansible-lint
        run: ansible-lint -c .config/ansible-lint.yml .


  molecule:
    name: Molecule - Ubuntu 22.04
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Molecule
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          pip install "molecule-plugins[docker]"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Make role available to Ansible
        run: |
          mkdir -p ~/.ansible/roles/halif
          ln -s "$GITHUB_WORKSPACE" ~/.ansible/roles/halif/rundeck

      - name: Molecule syntax
        run: molecule syntax --scenario-name default

      - name: Molecule create
        id: molecule_create
        continue-on-error: true
        run: molecule create --scenario-name default

      - name: Molecule converge
        id: molecule_converge
        if: steps.molecule_create.outcome == 'success'
        continue-on-error: true
        run: molecule converge --scenario-name default

      - name: Molecule idempotence
        id: molecule_idempotence
        if: steps.molecule_converge.outcome == 'success'
        continue-on-error: true
        run: molecule idempotence --scenario-name default

      - name: Molecule verify
        id: molecule_verify
        if: steps.molecule_idempotence.outcome == 'success'
        continue-on-error: true
        run: molecule verify --scenario-name default

      - name: Show Molecule diagnostics
        if: >-
          always() &&
          (
            steps.molecule_create.outcome == 'failure' ||
            steps.molecule_converge.outcome == 'failure' ||
            steps.molecule_idempotence.outcome == 'failure' ||
            steps.molecule_verify.outcome == 'failure'
          )
        run: |
          echo "===== Docker containers ====="
          docker ps -a

          CONTAINER_ID=$(docker ps -aq --filter "name=ubuntu22" | head -n 1)

          if [ -z "$CONTAINER_ID" ]; then
            echo "Rundeck test container not found"
            exit 0
          fi

          echo "===== Container inspect ====="
          docker inspect "$CONTAINER_ID" || true

          echo "===== Rundeck service status ====="
          docker exec "$CONTAINER_ID" \
            systemctl status rundeckd.service --no-pager || true

          echo "===== Rundeck systemd journal ====="
          docker exec "$CONTAINER_ID" \
            journalctl -xeu rundeckd.service \
            --no-pager \
            -n 200 || true

          echo "===== Rundeck service.log ====="
          docker exec "$CONTAINER_ID" bash -lc '
            if [ -f /var/log/rundeck/service.log ]; then
              tail -n 200 /var/log/rundeck/service.log
            else
              echo "service.log not found"
            fi
          ' || true

          echo "===== Rundeck rundeck.log ====="
          docker exec "$CONTAINER_ID" bash -lc '
            if [ -f /var/log/rundeck/rundeck.log ]; then
              tail -n 200 /var/log/rundeck/rundeck.log
            else
              echo "rundeck.log not found"
            fi
          ' || true

          echo "===== Rundeck log directory ====="
          docker exec "$CONTAINER_ID" \
            ls -lah /var/log/rundeck/ || true

          echo "===== Failed services ====="
          docker exec "$CONTAINER_ID" \
            systemctl --failed --no-pager || true

          echo "===== Java version ====="
          docker exec "$CONTAINER_ID" java -version 2>&1 || true

          echo "===== Java environment ====="
          docker exec "$CONTAINER_ID" \
            printenv | grep -E 'JAVA|RDECK|RUNDECK' || true

          echo "===== Rundeck processes ====="
          docker exec "$CONTAINER_ID" \
            ps auxww | grep -Ei '[r]undeck|[j]ava' || true

          echo "===== Rundeck configuration ====="
          docker exec "$CONTAINER_ID" bash -lc '
            for file in \
              /etc/rundeck/rundeck-config.properties \
              /etc/rundeck/framework.properties \
              /etc/rundeck/realm.properties; do
              if [ -f "$file" ]; then
                echo "===== $file ====="
                sed -E "s/(password|token|secret)([^=]*=[[:space:]]*).*/\1\2[REDACTED]/I" "$file"
              fi
            done
          ' || true

      - name: Molecule destroy
        if: always()
        run: molecule destroy --scenario-name default || true

      - name: Fail Molecule job
        if: always()
        env:
          CREATE_OUTCOME: ${{ steps.molecule_create.outcome }}
          CONVERGE_OUTCOME: ${{ steps.molecule_converge.outcome }}
          IDEMPOTENCE_OUTCOME: ${{ steps.molecule_idempotence.outcome }}
          VERIFY_OUTCOME: ${{ steps.molecule_verify.outcome }}
        run: |
          if [[ "$CREATE_OUTCOME" == "failure" ||
                "$CONVERGE_OUTCOME" == "failure" ||
                "$IDEMPOTENCE_OUTCOME" == "failure" ||
                "$VERIFY_OUTCOME" == "failure" ]]; then
            echo "Molecule test failed"
            exit 1
          fi
