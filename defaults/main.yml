---
# Тип базы данных: h2 (по умолчанию), mysql, postgresql
rundeck_version: "5.1.0.20240214-1"
rundeck_database_type: h2
rundeck_install_java: true
rundeck_package_state: present

# Java packages by OS family
rundeck_java_package_debian: "openjdk-17-jre-headless"
rundeck_java_package_redhat: "java-17-openjdk-headless"

rundeck_database_host: "localhost"
rundeck_database_port: "{{ '3306' if rundeck_database_type == 'mysql' else '5432' }}"
rundeck_database_name: "rundeck"
rundeck_database_username: "rundeck"
rundeck_database_password: "rundeck"

rundeck_database_url: >-
  {%- if rundeck_database_type == 'mysql' -%}
  {{
    'jdbc:mysql://'
    ~ rundeck_database_host
    ~ ':'
    ~ rundeck_database_port
    ~ '/'
    ~ rundeck_database_name
    ~ '?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true'
  }}
  {%- elif rundeck_database_type == 'postgresql' -%}
  {{
    'jdbc:postgresql://'
    ~ rundeck_database_host
    ~ ':'
    ~ rundeck_database_port
    ~ '/'
    ~ rundeck_database_name
  }}
  {%- else -%}
  jdbc:h2:file:/var/lib/rundeck/data/grailsdb;NON_KEYWORDS=MONTH,HOUR,MINUTE,YEAR,SECONDS;DB_CLOSE_ON_EXIT=FALSE
  {%- endif -%}

rundeck_database_driver: >-
  {%- if rundeck_database_type == 'mysql' -%}
  com.mysql.cj.jdbc.Driver{%- elif rundeck_database_type == 'postgresql' -%}
  org.postgresql.Driver{%- else -%}
  org.h2.Driver{%- endif -%}

rundeck_jdbc_mysql_version: "8.0.33"
rundeck_jdbc_postgresql_version: "42.7.3"

rundeck_jdbc_lib_dir: "/var/lib/rundeck/lib"
