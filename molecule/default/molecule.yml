---
driver:
  name: docker

platforms:
  - name: ubuntu22
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: "/lib/systemd/systemd"
    cgroupns_mode: host

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible

  config_options:
    defaults:
      remote_tmp: /tmp
      interpreter_python: auto_silent

verifier:
  name: ansible
